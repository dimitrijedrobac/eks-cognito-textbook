{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guestbook
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # ALB settings
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.annotations.scheme | default "internet-facing" | quote }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.annotations.targetType | default "ip" | quote }}

    # Cognito auth
    alb.ingress.kubernetes.io/auth-type: "cognito"
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: {{ .Values.ingress.annotations.authOnUnauthenticatedRequest | default "authenticate" | quote }}
    alb.ingress.kubernetes.io/auth-scope: "openid"
    alb.ingress.kubernetes.io/auth-session-cookie: {{ .Values.ingress.annotations.authSessionCookie | default "alb-auth" | quote }}
    alb.ingress.kubernetes.io/auth-session-timeout: {{ .Values.ingress.annotations.authSessionTimeout | default "3600" | quote }}
    alb.ingress.kubernetes.io/auth-idp-cognito: {{ (dict
        "userPoolArn"      .Values.cognito.userPoolArn
        "userPoolClientId" .Values.cognito.userPoolClientId
        "userPoolDomain"   .Values.cognito.userPoolDomain
      ) | toJson | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "alb" | quote }}
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.service.name | default "guestbook" | quote }}
                port:
                  number: {{ .Values.service.port | default 80 }}
    {{- else }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.service.name | default "guestbook" | quote }}
                port:
                  number: {{ .Values.service.port | default 80 }}
    {{- end }}
{{- end }}
